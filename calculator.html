<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Calculator</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#1e293b,#0f172a);font-family:Arial,sans-serif}.calc{background:#1f2937;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}#d{width:100%;height:60px;margin-bottom:15px;border:none;border-radius:10px;background:#111827;color:#fff;font-size:2rem;text-align:right;padding:10px;box-sizing:border-box}.g{display:grid;grid-template-columns:repeat(4,70px);gap:10px}button{height:60px;border:none;border-radius:12px;background:#374151;color:#fff;font-size:1.2rem;cursor:pointer;transition:.15s}button:hover{background:#4b5563;transform:translateY(-1px)}.op{background:#f59e0b}.eq{background:#10b981}.ac{background:#ef4444}</style></head><body><div class='calc'><input id='d' readonly><div class='g'><button class='ac' onclick='c()'>AC</button><button onclick='a("(")'>(</button><button onclick='a(")")'>)</button><button class='op' onclick='a("/")'>÷</button><button onclick='a("7")'>7</button><button onclick='a("8")'>8</button><button onclick='a("9")'>9</button><button class='op' onclick='a("*")'>×</button><button onclick='a("4")'>4</button><button onclick='a("5")'>5</button><button onclick='a("6")'>6</button><button class='op' onclick='a("-")'>−</button><button onclick='a("1")'>1</button><button onclick='a("2")'>2</button><button onclick='a("3")'>3</button><button class='op' onclick='a("+")'>+</button><button onclick='a("0")'>0</button><button onclick='a(".")'>.</button><button class='eq' onclick='e()'>=</button></div></div><script>const d=document.getElementById('d');function a(v){d.value+=v}function c(){d.value=''}function e(){try{d.value=Function('return '+d.value)()}catch{d.value='Error'}}document.addEventListener('keydown',e2=>{const k=e2.key;if(/[0-9]/.test(k)||['+','-','*','/','(',')','.'].includes(k)){a(k);e2.preventDefault()}else if(k==='Enter'||k==='='){e();e2.preventDefault()}else if(k==='Backspace'){d.value=d.value.slice(0,-1);e2.preventDefault()}else if(k==='Delete'||k==='Escape'){c();e2.preventDefault()}});</script></body></html>
